<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HKIA Character Viewer</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar__header">
          <h1>Hello Kitty Character Viewer</h1>
          <p id="characterCount">Loading characters…</p>
        </div>
        <div class="sidebar__search">
          <input id="characterSearch" type="search" placeholder="Filter characters">
        </div>
        <div id="characterList" class="character-list"></div>
      </aside>

      <section class="viewer-shell">
        <header class="toolbar">
          <button id="resetCamera" type="button">Reset camera</button>
          <label><input id="toggleWireframe" type="checkbox"> Wireframe</label>
          <label><input id="toggleSkeleton" type="checkbox"> Skeleton</label>
          <span id="status" class="status">Ready</span>
        </header>

        <section class="viewport">
          <canvas id="viewerCanvas"></canvas>
          <div id="emptyState" class="empty-state">Select a character from the left.</div>
        </section>

        <section class="animation-panel">
          <div class="animation-panel__header">
            <strong>Animations</strong>
            <label><input id="loopToggle" type="checkbox" checked> Loop</label>
          </div>
          <div class="animation-panel__controls">
            <select id="animationSelect"></select>
            <button id="playAnimation" type="button">Play</button>
            <button id="pauseAnimation" type="button">Pause</button>
            <button id="stopAnimation" type="button">Stop</button>
          </div>
          <div id="animationStatus" class="animation-status">No model loaded.</div>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
